name: Aktualizovať FPL

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnuť repozitár
        uses: actions/checkout@v4

      - name: Nastaviť Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Spustiť Python skript
        run: python generuj.py

      - name: Uložiť zmeny na GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatická aktualizácia FPL dát"
          commit_user_name: "FPL Bot"
          commit_user_email: "bot@actions.local"
