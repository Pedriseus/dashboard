name: Aktualizácia Dashboard Dát

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Stiahnutie FPL Mini-ligy
        run: |
          curl -s -L -A "Mozilla/5.0" "https://fantasy.premierleague.com/api/leagues-classic/28856/standings/?page_standings=1" -o fpl-league.json

      - name: Stiahnutie Reddit feedov (Priamy parser + Fallbacky)
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import xml.etree.ElementTree as ET
          import time
          import random

          subs = ["Slovakia", "Gunners", "FantasyPL"]

          def fetch_sub(sub):
              # Unikátny User-Agent podľa pravidiel Redditu, aby neblokoval GitHub IP
              ua = f"linux:arsenal.daily.dashboard:v2.4.{random.randint(100,999)} (by /u/odeargod_sk)"
              headers = {
                  "User-Agent": ua,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,application/json,*/*;q=0.8",
                  "Accept-Language": "sk-SK,sk;q=0.9,en-US;q=0.8,en;q=0.7"
              }

              # 1. POKUS: Priamy Reddit RSS (.rss) - spracovaný lokálne bez rss2json
              for domain in ["https://www.reddit.com", "https://old.reddit.com"]:
                  url_rss = f"{domain}/r/{sub}/hot/.rss?limit=12"
                  try:
                      req = urllib.request.Request(url_rss, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          root = ET.fromstring(resp.read())
                          ns = {"atom": "http://www.w3.org/2005/Atom"}
                          items = []
                          for entry in root.findall("atom:entry", ns):
                              title_el = entry.find("atom:title", ns)
                              link_el = entry.find("atom:link", ns)
                              author_el = entry.find("atom:author/atom:name", ns)

                              title = title_el.text if title_el is not None else "Bez názvu"
                              link = link_el.attrib.get("href", f"https://www.reddit.com/r/{sub}/") if link_el is not None else f"https://www.reddit.com/r/{sub}/"
                              author = author_el.text if author_el is not None else f"r/{sub}"

                              items.append({
                                  "title": title,
                                  "link": link,
                                  "author": author
                              })
                          if items:
                              print(f"[OK - RSS {domain}] r/{sub}: {len(items)} príspevkov")
                              return items[:10]
                  except Exception as e:
                      print(f"[WARN] RSS {domain} pre r/{sub} zlyhal: {e}")

              # 2. POKUS: Reddit JSON endpoint
              for domain in ["https://old.reddit.com", "https://www.reddit.com"]:
                  url_json = f"{domain}/r/{sub}/hot.json?limit=12&raw_json=1"
                  try:
                      req = urllib.request.Request(url_json, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          data = json.loads(resp.read().decode("utf-8"))
                          items = []
                          for child in data.get("data", {}).get("children", []):
                              p = child.get("data", {})
                              if not p.get("stickied"):
                                  items.append({
                                      "title": p.get("title", "Bez názvu"),
                                      "link": f"https://www.reddit.com{p.get('permalink', '')}",
                                      "author": p.get("author", f"r/{sub}")
                                  })
                          if items:
                              print(f"[OK - JSON {domain}] r/{sub}: {len(items)} príspevkov")
                              return items[:10]
                  except Exception as e:
                      print(f"[WARN] JSON {domain} pre r/{sub} zlyhal: {e}")

              # 3. POKUS: Záložné Redlib zrkadlá (ak by Reddit blokoval celú GitHub podsieť)
              mirrors = ["https://redlib.catsarch.com", "https://redlib.perennialte.ch", "https://redlib.tux.pizza"]
              for mirror in mirrors:
                  try:
                      req = urllib.request.Request(f"{mirror}/r/{sub}/hot.rss", headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          root = ET.fromstring(resp.read())
                          items = []
                          # Redlib vracia štandardný RSS 2.0 (<item>) alebo Atom
                          for item in root.findall(".//item"):
                              t = item.find("title")
                              l = item.find("link")
                              dc = item.find("{http://purl.org/dc/elements/1.1/}creator")
                              link_txt = (l.text or "").replace(mirror, "https://www.reddit.com")
                              items.append({
                                  "title": t.text if t is not None else "Bez názvu",
                                  "link": link_txt,
                                  "author": dc.text if dc is not None else f"r/{sub}"
                              })
                          if items:
                              print(f"[OK - Mirror {mirror}] r/{sub}: {len(items)} príspevkov")
                              return items[:10]
                  except Exception as e:
                      print(f"[WARN] Mirror {mirror} pre r/{sub} zlyhal: {e}")

              return []

          for s in subs:
              posts = fetch_sub(s)
              filename = f"reddit-{s.lower()}.json"
              if posts:
                  with open(filename, "w", encoding="utf-8") as f:
                      json.dump({"status": "ok", "items": posts}, f, ensure_ascii=False, indent=2)
              else:
                  print(f"[ERROR] Nepodarilo sa stiahnuť r/{s}, ponechávam predošlý súbor.")
              time.sleep(2)
          EOF

      - name: Commit a Push dát do repozitára
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl-league.json reddit-*.json
          git diff --staged --quiet || git commit -m "Auto-update dashboard data files"
          git push
