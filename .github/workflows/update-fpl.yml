name: Aktualizácia Dashboard Dát

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Stiahnutie FPL Mini-ligy
        run: |
          curl -s -L -A "Mozilla/5.0" "https://fantasy.premierleague.com/api/leagues-classic/28856/standings/?page_standings=1" -o fpl-league.json

      - name: Stiahnutie Reddit feedov cez rss2json (s lomkou /hot/.rss)
        run: |
          curl -s -L "https://api.rss2json.com/v1/api.json?rss_url=https://www.reddit.com/r/Slovakia/hot/.rss" -o reddit-slovakia.json || true
          sleep 3
          curl -s -L "https://api.rss2json.com/v1/api.json?rss_url=https://www.reddit.com/r/Gunners/hot/.rss" -o reddit-gunners.json || true
          sleep 3
          curl -s -L "https://api.rss2json.com/v1/api.json?rss_url=https://www.reddit.com/r/FantasyPL/hot/.rss" -o reddit-fantasypl.json || true

      - name: Commit a Push dát do repozitára
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl-league.json reddit-*.json
          git diff --staged --quiet || git commit -m "Auto-update dashboard data files"
          git push
