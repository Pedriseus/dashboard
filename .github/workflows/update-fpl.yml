name: Aktualizácia FPL Mini-ligy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-fpl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Stiahnutie dát z FPL API (Liga 28856)
        run: |
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
          "https://fantasy.premierleague.com/api/leagues-classic/28856/standings/?page_standings=1" \
          -o fpl-league.json

      - name: Commit a Push fpl-league.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl-league.json
          git diff --staged --quiet || git commit -m "Auto-update FPL mini-league standings"
          git push
