name: Aktualizácia Dashboard Dát

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Stiahnutie FPL Mini-ligy
        run: |
          curl -s -L -A "Mozilla/5.0" "https://fantasy.premierleague.com/api/leagues-classic/28856/standings/?page_standings=1" -o fpl-league.json

      - name: Stiahnutie Reddit JSON feedov priamo
        run: |
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) DashboardBot/1.0" "https://old.reddit.com/r/Slovakia/hot.json?limit=10&raw_json=1" -o reddit-slovakia.json || true
          sleep 2
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) DashboardBot/1.0" "https://old.reddit.com/r/Gunners/hot.json?limit=10&raw_json=1" -o reddit-gunners.json || true
          sleep 2
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) DashboardBot/1.0" "https://old.reddit.com/r/FantasyPL/hot.json?limit=10&raw_json=1" -o reddit-fantasypl.json || true

      - name: Commit a Push dát do repozitára
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl-league.json reddit-*.json
          git diff --staged --quiet || git commit -m "Auto-update dashboard data files"
          git push
