name: Aktualizácia FPL a Reddit dát

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Stiahnutie dát z FPL API (Liga 28856)
        run: |
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
          "https://fantasy.premierleague.com/api/leagues-classic/28856/standings/?page_standings=1" \
          -o fpl-league.json

      - name: Stiahnutie Reddit feedov (Slovakia, Gunners, FantasyPL)
        run: |
          curl -s -L -A "script:arsenal.dashboard:v1.9 (by /u/gunner)" "https://www.reddit.com/r/Slovakia/hot.json?limit=10&raw_json=1" -o reddit-slovakia.json || true
          curl -s -L -A "script:arsenal.dashboard:v1.9 (by /u/gunner)" "https://www.reddit.com/r/Gunners/hot.json?limit=10&raw_json=1" -o reddit-gunners.json || true
          curl -s -L -A "script:arsenal.dashboard:v1.9 (by /u/gunner)" "https://www.reddit.com/r/FantasyPL/hot.json?limit=10&raw_json=1" -o reddit-fantasypl.json || true

      - name: Commit a Push aktualizovaných JSON súborov
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl-league.json reddit-*.json
          git diff --staged --quiet || git commit -m "Auto-update FPL & Reddit feeds"
          git push
