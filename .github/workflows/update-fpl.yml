name: Aktualizácia FPL Mini-ligy
on:
  schedule:
    - cron: '*/30 * * * *' # Spustí sa automaticky každých 30 minút
  workflow_dispatch:       # Umožní manuálne spustenie jedným klikom v GitHub rozhraní

permissions:
  contents: write

jobs:
  fetch-fpl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Stiahnutie dát z FPL API
        run: |
          curl -s -A "Mozilla/5.0" "https://fantasy.premierleague.com/api/leagues-classic/28856/standings/?page_standings=1" -o fpl-league.json
          
      - name: Uloženie a push do repozitára
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl-league.json
          git diff --staged --quiet || git commit -m "Auto-update FPL mini-league data"
          git push
