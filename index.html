<!-- SKRIPT 1: DÁTUM A ČAS + ROBUSTNÉ NAČÍTANIE FPL DEADLINE -->
    <script>
        function updateDateTime() {
            try {
                var now = new Date();
                var formattedDate = now.toLocaleDateString('sk-SK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('current-date').textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
                document.getElementById('current-time').textContent = now.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {}
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        function loadFPLDeadline() {
            // Použijeme stabilnejšiu alternatívnu proxy službu (corsproxy.io), prípadne záložnú
            var fplUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://fantasy.premierleague.com/api/bootstrap-static/');
            
            fetch(fplUrl)
                .then(res => {
                    if (!res.ok) throw new Error('Network response was not ok');
                    return res.json();
                })
                .then(staticData => {
                    var events = staticData.events;
                    var found = false;
                    for (var i = 0; i < events.length; i++) {
                        if (events[i].is_next) {
                            var dlDate = new Date(events[i].deadline_time);
                            var options = { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' };
                            var formattedDl = dlDate.toLocaleDateString('sk-SK', options) + ' o ' + dlDate.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
                            document.getElementById('fpl-deadline').textContent = formattedDl;
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        document.getElementById('fpl-deadline').textContent = "Žiadny nadchádzajúci deadline";
                    }
                })
                .catch(err => {
                    // Záložný pokus cez inú proxy ak by corsproxy zlyhalo
                    fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://fantasy.premierleague.com/api/bootstrap-static/'))
                        .then(res => res.json())
                        .then(data => {
                            var staticData = JSON.parse(data.contents);
                            var events = staticData.events;
                            for (var i = 0; i < events.length; i++) {
                                if (events[i].is_next) {
                                    var dlDate = new Date(events[i].deadline_time);
                                    var options = { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' };
                                    var formattedDl = dlDate.toLocaleDateString('sk-SK', options) + ' o ' + dlDate.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
                                    document.getElementById('fpl-deadline').textContent = formattedDl;
                                    break;
                                }
                            }
                        })
                        .catch(() => {
                            document.getElementById('fpl-deadline').textContent = "Nepodarilo sa načítať";
                        });
                });
        }
        loadFPLDeadline();
    </script>
