<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj Denný Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- HLAVIČKA: Dátum a Čas -->
        <header class="card p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 id="greeting" class="text-2xl md:text-3xl font-bold text-white">Dobrý deň! 👋</h1>
                <p id="current-date" class="text-slate-400 text-lg mt-1">Načítavam dátum...</p>
            </div>
            <div class="text-right">
                <div id="current-time" class="text-4xl font-extrabold text-sky-400 tracking-tight">--:--</div>
            </div>
        </header>

        <!-- HORNÝ RIADOK: Počasie + Google Kalendár -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- POČASIE (5 stĺpcov) -->
            <section class="card p-6 lg:col-span-5 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2 mb-4">
                        🌤️ Počasie dnes <span class="text-sm font-normal text-slate-400">(Bratislava)</span>
                    </h2>
                    <div id="weather-content" class="text-slate-300 py-2">
                        Načítavam aktuálne počasie...
                    </div>
                    <!-- Dynamický tip na obliekanie podľa reálneho počasia -->
                    <div id="clothing-tip" class="mt-4"></div>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-700/60 text-xs text-slate-400 flex justify-between">
                    <span>Zdroj: Open-Meteo (naživo)</span>
                    <button onclick="fetchWeather()" class="text-sky-400 hover:underline">↻ Obnoviť</button>
                </div>
            </section>

            <!-- GOOGLE KALENDÁR A UDALOSTI (7 stĺpcov) -->
            <section class="card p-6 lg:col-span-7">
                <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                        📅 Môj Google Kalendár
                    </h2>
                    <div class="flex gap-2">
                        <button id="btn-view-list" onclick="toggleCalendarView('list')" class="px-3 py-1 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 transition">
                            Prehľad udalostí
                        </button>
                        <button id="btn-view-embed" onclick="toggleCalendarView('embed')" class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                            Živý Google Kalendár
                        </button>
                        <a href="https://calendar.google.com" target="_blank" class="px-3 py-1 rounded-lg text-xs bg-slate-800 text-sky-400 hover:bg-slate-700 transition">
                            Otvoriť ↗
                        </a>
                    </div>
                </div>

                <div id="calendar-list-view" class="space-y-2.5"></div>

                <div id="calendar-embed-view" class="hidden">
                    <div class="rounded-lg overflow-hidden border border-slate-700 bg-white">
                        <iframe 
                            src="https://calendar.google.com/calendar/embed?src=peterladi14%40gmail.com&ctz=Europe%2FBratislava&mode=AGENDA&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0" 
                            style="border: 0" 
                            width="100%" 
                            height="220" 
                            frameborder="0" 
                            scrolling="no">
                        </iframe>
                    </div>
                </div>
            </section>

        </div>

        <!-- SPODNÝ RIADOK: Reddit Feed (Reálne Top za 24h s počtom upvotov) -->
        <section class="card p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                        🔥 Top upvotované posty na Reddite <span class="text-sm font-normal text-slate-400">(za posledných 24 hodín)</span>
                    </h2>
                </div>
                <div id="subreddit-tabs" class="flex flex-wrap gap-2"></div>
            </div>
            
            <div id="reddit-content" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                Načítavam príspevky...
            </div>
        </section>

    </div>

        function updateDateTime() {
            const now = new Date();
            const hour = now.getHours();
            
            let greet = "Dobrý deň! 👋";
            if (hour < 10) greet = "Dobré ráno! ☕";
            else if (hour >= 18) greet = "Dobrý večer! 🌙";
            document.getElementById('greeting').textContent = greet;

            const formattedDate = now.toLocaleDateString('sk-SK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('current-date').textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
            document.getElementById('current-time').textContent = now.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateDateTime, 1000);
