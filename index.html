<script>
        // --- DÁTUM A ČAS ---
        function updateDateTime() {
            var now = new Date();
            var hour = now.getHours();
            var greet = "Dobrý deň! 👋";
            if (hour < 10) greet = "Dobré ráno! ☕";
            else if (hour >= 18) greet = "Dobrý večer! 🌙";
            document.getElementById('greeting').textContent = greet;

            var formattedDate = now.toLocaleDateString('sk-SK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('current-date').textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
            document.getElementById('current-time').textContent = now.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // --- STABILNÉ NAČÍTANIE ČISTÝCH POSTOV ---
        async function loadReddit(subreddit, elementId) {
            var container = document.getElementById(elementId);
            try {
                var rssUrl = 'https://www.reddit.com/r/' + subreddit + '/top/.rss?t=day';
                var res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl));
                var data = await res.json();
                
                if (!data || !Array.isArray(data.items)) throw new Error("Chyba");

                container.innerHTML = data.items.slice(0, 5).map(function(item) {
                    var title = item.title;
                    var link = item.link;
                    var pubDate = new Date(item.pubDate);
                    var hoursAgo = Math.max(1, Math.floor((Date.now() - pubDate.getTime()) / (1000 * 60 * 60)));

                    // Celá karta je teraz čistá a moderná, bez zbytočného textu vpravo
                    return '<a href="' + link + '" target="_blank" class="block p-3.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 transition flex justify-between items-center gap-4">' +
                        '<div class="space-y-1 flex-1 min-w-0">' +
                            '<h4 class="text-white text-sm font-medium leading-snug hover:text-sky-400 transition line-clamp-2">' + title + '</h4>' +
                            '<div class="text-xs text-slate-400">🕒 pred ' + hoursAgo + ' hod</div>' +
                        '</div>' +
                        '<span class="text-xs text-sky-400 font-semibold shrink-0">Prejsť ↗</span>' +
                    '</a>';
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="text-amber-300 text-xs">Nepodarilo sa načítať príspevky.</p>';
            }
        }

        loadReddit('Slovakia', 'list-slovakia');
        loadReddit('Gunners', 'list-gunners');

        // --- PREPÍNANIE ZÁLOŽIEK ---
        function showSub(target) {
            var colSsl = document.getElementById('col-slovakia');
            var colGun = document.getElementById('col-gunners');
            var grid = document.getElementById('reddit-grid');
            
            var btnAll = document.getElementById('tab-all');
            var btnSsl = document.getElementById('tab-slovakia');
            var btnGun = document.getElementById('tab-gunners');

            [btnAll, btnSsl, btnGun].forEach(function(b) {
                b.className = "px-3 py-1.5 rounded-lg text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700";
            });

            if (target === 'all') {
                grid.className = "grid grid-cols-1 lg:grid-cols-2 gap-6";
                colSsl.style.display = "block";
                colGun.style.display = "block";
                btnAll.className = "px-3 py-1.5 rounded-lg text-sm transition bg-sky-500 text-slate-950 font-semibold";
            } else if (target === 'slovakia') {
                grid.className = "grid grid-cols-1 gap-6";
                colSsl.style.display = "block";
                colGun.style.display = "none";
                btnSsl.className = "px-3 py-1.5 rounded-lg text-sm transition bg-sky-500 text-slate-950 font-semibold";
            } else if (target === 'gunners') {
                grid.className = "grid grid-cols-1 gap-6";
                colSsl.style.display = "none";
                colGun.style.display = "block";
                btnGun.className = "px-3 py-1.5 rounded-lg text-sm transition bg-sky-500 text-slate-950 font-semibold";
            }
        }
    </script>
